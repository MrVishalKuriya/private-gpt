[project]
name = "private-ai-backend"
version = "0.1.0"
description = "Regenesys Private AI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "neo4j>=5.20.0",
    "bcrypt>=4.1.0",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "pymupdf>=1.24.4",
    "python-docx>=1.1.0",
    "tiktoken>=0.7.0",
    "spacy>=3.7.4",
    "google-genai>=0.5.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "httpx>=0.27.0",
    "gunicorn>=22.0.0",
    "python-json-logger>=2.0.7",
    "sentry-sdk[fastapi]>=2.1.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
